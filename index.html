<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasheed: COE Academic Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .checklist-scroll::-webkit-scrollbar { width: 6px; }
        .checklist-scroll::-webkit-scrollbar-thumb { background: #D71920; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-[#D71920] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Initializing Rasheed Advisor...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const COE_DATA = {
            majors: [
                {
                    id: "ece",
                    name: "Early Childhood Education",
                    cohorts: ["2020-2021", "2022-2023", "2025-2026"],
                    plans: {
                        "2025-2026": [
                            { term: 1, courses: [
                                { code: "GEIT113", name: "Intro to Artificial Intelligence", ch: 3, type: "GenEd" },
                                { code: "GESU121", name: "Sustainability", ch: 3, type: "GenEd" },
                                { code: "GEIT112", name: "Fourth Industrial Revolution", ch: 3, type: "GenEd" },
                                { code: "GEEM110", name: "Contemporary Emirati Studies", ch: 3, type: "GenEd" },
                                { code: "GEAE101", name: "Academic English (STEM)", ch: 3, type: "GenEd" }
                            ]},
                            { term: 2, courses: [
                                { code: "SPED101", name: "Education of Exceptional Children", ch: 3, type: "Core" },
                                { code: "CURR101", name: "Educational Technology", ch: 3, type: "Core" },
                                { code: "FOED102", name: "Professional Ethics in Education", ch: 3, type: "Core" },
                                { code: "CURR233", name: "Classroom Management (Early Years)", ch: 3, type: "Core" },
                                { code: "GEAE102", name: "Academic English for Humanities", ch: 3, type: "GenEd" }
                            ]},
                            { term: 3, courses: [
                                { code: "CURR103", name: "Early Childhood Development & Learning", ch: 3, type: "Major" },
                                { code: "CURR212", name: "Language Development & Emergent Literacy", ch: 3, type: "Major" },
                                { code: "CURR312", name: "Religious and Social Concepts in ECE", ch: 3, type: "Support" },
                                { code: "ARB210", name: "Arabic Phonetics", ch: 3, type: "Support" },
                                { code: "CURR231", name: "Fiqh of Worship", ch: 3, type: "Support" }
                            ]},
                            { term: 4, courses: [
                                { code: "CURR211", name: "Planning & Implementation of ECE Curriculum", ch: 3, type: "Major" },
                                { code: "CURR320", name: "Math Education for Young Child", ch: 3, type: "Major" },
                                { code: "CURR311", name: "Creative Arts for Young Children", ch: 3, type: "Major" },
                                { code: "CURR114", name: "Recitation & Cantillation", ch: 3, type: "Support" },
                                { code: "PHED200", name: "Foundations of Health and PE", ch: 3, type: "Support" }
                            ]}
                        ],
                        "2020-2021": [
                            { term: 1, courses: [
                                { code: "ELPE103", name: "English for Education", ch: 6, type: "GenEd" },
                                { code: "PHI180", name: "Critical Thinking", ch: 3, type: "GenEd" },
                                { code: "GEEM110", name: "Emirati Studies", ch: 3, type: "GenEd" }
                            ]}
                        ]
                    }
                },
                {
                    id: "hpe",
                    name: "Health and Physical Education",
                    cohorts: ["2020-2021", "2025-2026"],
                    plans: {
                        "2025-2026": [
                            { term: 1, courses: [
                                { code: "GEEM110", name: "Emirati Studies", ch: 3, type: "GenEd" },
                                { code: "GEAE101", name: "Academic English (STEM)", ch: 3, type: "GenEd" },
                                { code: "GEIT113", name: "Intro to AI", ch: 3, type: "GenEd" },
                                { code: "PHED202", name: "Invasion Games", ch: 2, type: "Major" },
                                { code: "PHED203", name: "Swimming", ch: 2, type: "Major" }
                            ]},
                            { term: 2, courses: [
                                { code: "CURR101", name: "Educational Technology", ch: 3, type: "Prof" },
                                { code: "FOED102", name: "Professional Ethics", ch: 3, type: "Prof" },
                                { code: "PHED205", name: "Adapted Physical Education", ch: 3, type: "Prof" },
                                { code: "PHED208", name: "Motor Learning", ch: 3, type: "Major" },
                                { code: "PHED204", name: "Human Anatomy and Physiology", ch: 4, type: "Major" }
                            ]}
                        ]
                    }
                },
                {
                    id: "sped_gifted",
                    name: "Special Ed: Gifted and Talented",
                    cohorts: ["2025-2026"],
                    plans: {
                        "2025-2026": [
                            { term: 1, courses: [
                                { code: "GEAE101", name: "English for Humanities", ch: 3, type: "GenEd" },
                                { code: "GEIT113", name: "Intro to AI", ch: 3, type: "GenEd" },
                                { code: "GEEM110", name: "Emirati Studies", ch: 3, type: "GenEd" },
                                { code: "GESU121", name: "Sustainability", ch: 3, type: "GenEd" }
                            ]},
                            { term: 2, courses: [
                                { code: "SPED101", name: "Education of Exceptional Children", ch: 3, type: "Core" },
                                { code: "CURR101", name: "Educational Technology", ch: 3, type: "Core" },
                                { code: "FOED102", name: "Professional Ethics", ch: 3, type: "Core" },
                                { code: "SPED321", name: "Gifted and Talented", ch: 3, type: "Major" }
                            ]},
                            { term: 3, courses: [
                                { code: "SPED331", name: "Curriculum for Gifted", ch: 3, type: "Conc" },
                                { code: "SPED326", name: "Educating Gifted in Regular Classroom", ch: 2, type: "Conc" },
                                { code: "SPED416", name: "Research Seminar for Gifted", ch: 3, type: "Conc" }
                            ]}
                        ]
                    }
                },
                {
                    id: "sped_mild",
                    name: "Special Ed: Mild/Mod Disabilities",
                    cohorts: ["2025-2026"],
                    plans: {
                        "2025-2026": [
                            { term: 1, courses: [
                                { code: "GEAE101", name: "English for Humanities", ch: 3, type: "GenEd" },
                                { code: "GEIT113", name: "Intro to AI", ch: 3, type: "GenEd" }
                            ]},
                            { term: 2, courses: [
                                { code: "SPED101", name: "Exceptional Children", ch: 3, type: "Core" },
                                { code: "SPED312", name: "Individuals with Mild/Mod Disabilities", ch: 3, type: "Conc" },
                                { code: "SPED361", name: "Teaching Children with Mild/Mod Disabilities", ch: 3, type: "Conc" }
                            ]}
                        ]
                    }
                },
                {
                    id: "sped_sensory",
                    name: "Special Ed: Sensory Impairments",
                    cohorts: ["2025-2026"],
                    plans: {
                        "2025-2026": [
                            { term: 1, courses: [
                                { code: "GEAE101", name: "English for Humanities", ch: 3, type: "GenEd" },
                                { code: "SPED315", name: "Individuals with Sensory Impairments", ch: 3, type: "Conc" }
                            ]}
                        ]
                    }
                },
                {
                    id: "sped_severe",
                    name: "Special Ed: Severe Disabilities",
                    cohorts: ["2025-2026"],
                    plans: {
                        "2025-2026": [
                            { term: 1, courses: [
                                { code: "GEAE101", name: "English for Humanities", ch: 3, type: "GenEd" },
                                { code: "SPED330", name: "Individuals with Severe Disabilities", ch: 3, type: "Conc" }
                            ]}
                        ]
                    }
                }
            ]
        };

        function App() {
            const [major, setMajor] = useState(null);
            const [cohort, setCohort] = useState("");
            const [completed, setCompleted] = useState({});
            const [showSummer, setShowSummer] = useState(false);
            const [showNext, setShowNext] = useState(false);
            const [showLong, setShowLong] = useState(false);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const plan = useMemo(() => {
                if (!major || !cohort) return [];
                return major.plans[cohort] || [];
            }, [major, cohort]);

            const allCourses = useMemo(() => plan.flatMap(p => p.courses), [plan]);
            const earnedCH = useMemo(() => allCourses.filter(c => completed[c.code]).reduce((sum, c) => sum + c.ch, 0), [allCourses, completed]);

            const registrationInfo = useMemo(() => {
                const ch = earnedCH;
                let summerDate = "April 09, 2026";
                let fallDate = "April 20-21, 2026";
                let fallGroup = "0-11 Credit Hours";

                if (ch >= 99) summerDate = "April 06, 2026";
                else if (ch >= 81) summerDate = "April 07, 2026";
                else if (ch >= 63) summerDate = "April 08, 2026";

                if (ch >= 84) { fallDate = "April 13-14, 2026"; fallGroup = "84+ CH / Honors"; }
                else if (ch >= 45) { fallDate = "April 14-15, 2026"; fallGroup = "45-83 CH"; }
                else if (ch >= 12) { fallDate = "April 15-16, 2026"; fallGroup = "12-44 CH"; }

                return { summerDate, fallDate, fallGroup };
            }, [earnedCH]);

            const remainingCourses = allCourses.filter(c => !completed[c.code]);

            return (
                <div className="min-h-screen">
                    <header className="bg-[#D71920] text-white p-6 shadow-lg sticky top-0 z-50 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <i data-lucide="graduation-cap" className="w-8 h-8"></i>
                            <div>
                                <h1 className="text-2xl font-black tracking-tight leading-none">Rasheed Advisor</h1>
                                <p className="text-[10px] uppercase font-bold opacity-80 mt-1">College of Education • UAEU</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-6 space-y-6">
                        <section className="bg-white rounded-3xl p-8 shadow-sm border-2 border-slate-100 animate-in fade-in duration-500">
                            <div className="flex items-start gap-5">
                                <div className="bg-[#D71920]/10 p-4 rounded-2xl shrink-0">
                                    <i data-lucide="sparkles" className="text-[#D71920] w-8 h-8"></i>
                                </div>
                                <div className="space-y-3">
                                    <h2 className="text-2xl font-black text-slate-900 tracking-tight text-xl sm:text-2xl">Welcome, Future Educator!</h2>
                                    <p className="text-slate-600 leading-relaxed italic text-sm sm:text-base">
                                        "I am Rasheed, your dedicated AI Advisor. Select your major and cohort plan to initiate your personalized academic strategy."
                                    </p>
                                </div>
                            </div>
                        </section>

                        <div className="bg-white rounded-3xl p-6 border-2 border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Department / Major</label>
                                <select onChange={(e) => {
                                    setMajor(COE_DATA.majors.find(x => x.id === e.target.value));
                                    setCohort(""); setCompleted({});
                                }} className="w-full p-4 bg-slate-50 border-2 rounded-2xl font-bold focus:border-[#D71920] outline-none">
                                    <option value="">Select Major...</option>
                                    {COE_DATA.majors.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                </select>
                            </div>
                            <div className="space-y-2">
                                <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Plan Year</label>
                                <select disabled={!major} onChange={(e) => setCohort(e.target.value)} value={cohort} className="w-full p-4 bg-slate-50 border-2 rounded-2xl font-bold outline-none focus:border-[#D71920] disabled:opacity-50">
                                    <option value="">Select Cohort...</option>
                                    {major?.cohorts.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                        </div>

                        {major && cohort && (
                            <div className="space-y-6 animate-in slide-in-from-bottom-5 duration-500">
                                <section className="bg-white rounded-3xl border-2 border-slate-100 overflow-hidden shadow-sm">
                                    <div className="bg-slate-50 p-6 border-b flex justify-between items-center">
                                        <div>
                                            <h3 className="font-black text-slate-800 tracking-tight">Full Degree Checklist</h3>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest italic">Check the courses you have completed</p>
                                        </div>
                                        <div className="bg-[#D71920] text-white px-5 py-2 rounded-2xl text-base font-black">{earnedCH} Credits</div>
                                    </div>
                                    <div className="p-4 max-h-[400px] overflow-y-auto space-y-2 checklist-scroll">
                                        {allCourses.map(c => (
                                            <div key={c.code} onClick={() => setCompleted(prev => ({...prev, [c.code]: !prev[c.code]}))} className={`p-4 rounded-xl cursor-pointer border-2 flex items-center gap-4 transition-all ${completed[c.code] ? 'bg-green-50 border-green-200 shadow-inner' : 'bg-white border-slate-50 hover:border-slate-200'}`}>
                                                <i data-lucide="check-circle" className={completed[c.code] ? 'text-green-500' : 'text-slate-100'}></i>
                                                <div className="flex-1">
                                                    <div className="text-sm font-bold text-slate-700">{c.name}</div>
                                                    <div className="text-[10px] font-black text-slate-400 uppercase mt-1 tracking-wider">{c.code} • {c.ch} CH • {c.type}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <div className="space-y-4">
                                    {/* Summer Suggestions */}
                                    <div className="space-y-2">
                                        <button onClick={() => setShowSummer(!showSummer)} className="w-full p-5 bg-white rounded-2xl border-2 border-slate-100 hover:border-orange-400 transition-all font-black text-slate-700 flex justify-between items-center group">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-orange-50 p-2 rounded-lg"><i data-lucide="sun" className="text-orange-400 w-5 h-5"></i></div>
                                                <span className="group-hover:text-orange-600 tracking-tight">Summer 2026 Suggested Registration</span>
                                            </div>
                                            <i data-lucide="chevron-down" className={`text-slate-300 transition-transform ${showSummer ? 'rotate-180' : ''}`}></i>
                                        </button>
                                        {showSummer && (
                                            <div className="p-6 bg-white rounded-3xl border-2 border-orange-100 animate-in zoom-in-95 shadow-inner">
                                                <div className="text-[10px] font-black text-orange-600 uppercase tracking-widest mb-3">Priority Summer Load (Max 6 CH):</div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    {remainingCourses.slice(0, 2).map(c => (
                                                        <div key={c.code} className="bg-orange-50/50 p-4 rounded-xl border border-orange-100 flex items-center gap-3">
                                                            <div className="w-2 h-2 rounded-full bg-orange-400"></div>
                                                            <span className="text-xs font-bold text-slate-700">{c.code}: {c.name}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Next Term Suggestions */}
                                    <div className="space-y-2">
                                        <button onClick={() => setShowNext(!showNext)} className="w-full p-5 bg-white rounded-2xl border-2 border-slate-100 hover:border-blue-400 transition-all font-black text-slate-700 flex justify-between items-center group">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-blue-50 p-2 rounded-lg"><i data-lucide="calendar" className="text-blue-400 w-5 h-5"></i></div>
                                                <span className="group-hover:text-blue-600 tracking-tight">Next Semester Strategy (Fall 2026)</span>
                                            </div>
                                            <i data-lucide="chevron-down" className={`text-slate-300 transition-transform ${showNext ? 'rotate-180' : ''}`}></i>
                                        </button>
                                        {showNext && (
                                            <div className="p-6 bg-white rounded-3xl border-2 border-blue-100 animate-in zoom-in-95 shadow-inner">
                                                <div className="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3">Fall Enrollment Suggestions (12-19 CH):</div>
                                                <div className="space-y-2">
                                                    {remainingCourses.slice(0, 5).map(c => (
                                                        <div key={c.code} className="p-4 bg-blue-50/50 rounded-xl border border-blue-100 flex justify-between items-center">
                                                            <span className="text-xs font-bold text-slate-700 italic">"{c.name}"</span>
                                                            <span className="text-[10px] font-black text-blue-400 bg-white px-3 py-1 rounded-full shadow-sm">{c.code}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Long Term Strategy */}
                                    <div className="space-y-2">
                                        <button onClick={() => setShowLong(!showLong)} className="w-full p-5 bg-white rounded-2xl border-2 border-slate-100 hover:border-emerald-400 transition-all font-black text-slate-700 flex justify-between items-center group">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-emerald-50 p-2 rounded-lg"><i data-lucide="trending-up" className="text-emerald-400 w-5 h-5"></i></div>
                                                <span className="group-hover:text-emerald-600 tracking-tight">Two-Semester Strategic Roadmap</span>
                                            </div>
                                            <i data-lucide="chevron-down" className={`text-slate-300 transition-transform ${showLong ? 'rotate-180' : ''}`}></i>
                                        </button>
                                        {showLong && (
                                            <div className="p-6 bg-white rounded-3xl border-2 border-emerald-100 animate-in zoom-in-95 shadow-inner">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                    <div className="space-y-4">
                                                        <h4 className="text-[10px] font-black text-emerald-700 uppercase tracking-widest border-b-2 border-emerald-50 pb-1 flex items-center gap-2">
                                                            <i data-lucide="map-pin" size="14"></i> Target Semester +1
                                                        </h4>
                                                        <div className="space-y-2">
                                                            {remainingCourses.slice(0, 4).map(c => (
                                                                <div key={c.code} className="p-3 bg-emerald-50/30 rounded-xl text-[10px] font-bold border border-emerald-100 text-slate-600">{c.code}: {c.name}</div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <div className="space-y-4">
                                                        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b-2 border-slate-100 pb-1 flex items-center gap-2">
                                                            <i data-lucide="navigation" size="14"></i> Forecast Semester +2
                                                        </h4>
                                                        <div className="space-y-2">
                                                            {remainingCourses.slice(4, 8).map(c => (
                                                                <div key={c.code} className="p-3 bg-slate-50 rounded-xl text-[10px] font-bold border border-slate-200 text-slate-400">{c.code}: {c.name}</div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Dynamic Registration Windows */}
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white space-y-10 shadow-2xl relative overflow-hidden border-4 border-white">
                                    <div className="absolute top-0 right-0 p-10 opacity-5 grayscale">
                                        <i data-lucide="clock" size="160"></i>
                                    </div>
                                    <div className="relative z-10 space-y-8">
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/5 pb-6">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-[#D71920] p-2 rounded-lg shadow-lg shadow-red-900/50"><i data-lucide="alarm-clock" className="w-6 h-6"></i></div>
                                                <h3 className="text-2xl font-black tracking-tight">Registration Timing & Constraints</h3>
                                            </div>
                                            <div className="px-4 py-1.5 bg-white/5 border border-white/10 rounded-full text-[10px] font-black uppercase text-[#D71920]">Based on {earnedCH} CH Earned</div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                            <div className="p-6 bg-white/5 rounded-[2rem] border border-white/10 relative overflow-hidden group">
                                                <p className="text-[10px] uppercase font-black tracking-[0.2em] text-orange-400 mb-2 flex items-center gap-2"><i data-lucide="sun" size="12"></i> Summer 2026 Early Access</p>
                                                <p className="text-4xl font-black text-white">{registrationInfo.summerDate}</p>
                                                <div className="mt-6 space-y-3">
                                                    <div className="flex justify-between text-[10px] font-black uppercase text-slate-500 border-t border-white/5 pt-4"><span>Max CH Allowed</span><span className="text-white">6 CH</span></div>
                                                    <div className="flex justify-between text-[10px] font-black uppercase text-slate-500"><span>Honors Limit</span><span className="text-orange-400">9 CH</span></div>
                                                </div>
                                            </div>
                                            <div className="p-6 bg-white/5 rounded-[2rem] border border-white/10 relative overflow-hidden group">
                                                <p className="text-[10px] uppercase font-black tracking-[0.2em] text-blue-400 mb-2 flex items-center gap-2"><i data-lucide="calendar" size="12"></i> Fall 2026 Early Access</p>
                                                <p className="text-4xl font-black text-white">{registrationInfo.fallDate}</p>
                                                <p className="text-[10px] font-black text-blue-400/60 mt-1 uppercase tracking-wider">{registrationInfo.fallGroup}</p>
                                                <div className="mt-6 space-y-3">
                                                    <div className="flex justify-between text-[10px] font-black uppercase text-slate-500 border-t border-white/5 pt-4"><span>Target Load</span><span className="text-white">12-19 CH</span></div>
                                                    <div className="flex justify-between text-[10px] font-black uppercase text-slate-500"><span>Expected Grads</span><span className="text-blue-400">22 CH</span></div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-[#D71920] p-6 rounded-2xl shadow-xl flex items-start gap-4">
                                            <i data-lucide="alert-circle" className="shrink-0 w-6 h-6"></i>
                                            <div className="space-y-1">
                                                <p className="text-xs font-black uppercase tracking-widest leading-none">Mandatory Requirement</p>
                                                <p className="text-xs font-bold opacity-80 leading-relaxed tracking-tight">Your Degree Works study plan must be ACTIVE & LOCKED prior to the registration windows above.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="max-w-4xl mx-auto px-8 py-12 flex justify-between items-center border-t border-slate-200 mt-10">
                        <div className="opacity-30 grayscale transition-all hover:opacity-100 hover:grayscale-0 flex items-center gap-6">
                            <p className="text-[9px] font-black uppercase tracking-[0.5em]">Rasheed v3.5</p>
                            <div className="w-8 h-[1px] bg-slate-400"></div>
                            <p className="text-[9px] font-black uppercase tracking-[0.5em]">United Arab Emirates University</p>
                        </div>
