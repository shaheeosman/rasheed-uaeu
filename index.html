<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasheed: COE Academic Assistant</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .checklist-scroll::-webkit-scrollbar { width: 6px; }
        .checklist-scroll::-webkit-scrollbar-thumb { background: #D71920; border-radius: 10px; }
        .btn-shadow { shadow-sm hover:shadow-md transition-all duration-200; }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-[#D71920] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Initializing Rasheed Advisor...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Comprehensive Data Structure from UAEU Plans
        const COE_DATA = {
            majors: [
                {
                    id: "ece",
                    name: "Early Childhood Education",
                    cohorts: ["2020-2021", "2022-2023", "2025-2026"],
                    plans: {
                        "2025-2026": [
                            { code: "GEIT113", name: "Intro to AI", ch: 3, type: "GenEd" },
                            { code: "GESU121", name: "Sustainability", ch: 3, type: "GenEd" },
                            { code: "GEEM110", name: "Contemporary Emirati Studies", ch: 3, type: "GenEd" },
                            { code: "GEAE101", name: "Academic English (STEM)", ch: 3, type: "GenEd" },
                            { code: "SPED101", name: "Education of Exceptional Children", ch: 3, type: "Core" },
                            { code: "CURR101", name: "Technology in Education", ch: 3, type: "Core" },
                            { code: "FOED102", name: "Professional Ethics in Education", ch: 3, type: "Core" },
                            { code: "CURR233", name: "Classroom Management (Early Years)", ch: 3, type: "Core" },
                            { code: "CURR103", name: "Early Childhood Development", ch: 3, type: "Major" },
                            { code: "CURR212", name: "Language Development & Literacy", ch: 3, type: "Major" },
                            { code: "CURR211", name: "Planning & Implementation of ECE", ch: 3, type: "Major" },
                            { code: "CURR320", name: "Math Education for Young Child", ch: 3, type: "Major" },
                            { code: "CURR311", name: "Creative Arts for Young Children", ch: 3, type: "Major" },
                            { code: "CURR425", name: "Capstone Experience", ch: 3, type: "Major" },
                            { code: "CURR465", name: "Student Teaching in ECE", ch: 9, type: "Internship" }
                        ],
                        "2022-2023": [
                            { code: "ELPE103", name: "English for Education", ch: 6, type: "GenEd" },
                            { code: "PHI180", name: "Critical Thinking", ch: 3, type: "GenEd" },
                            { code: "GEEM110", name: "Emirati Studies", ch: 3, type: "GenEd" },
                            { code: "CURR103", name: "Early Childhood Development", ch: 3, type: "Major" },
                            { code: "CURR211", name: "Planning & Implementation", ch: 3, type: "Major" }
                        ]
                    }
                },
                {
                    id: "hpe",
                    name: "Health and Physical Education",
                    cohorts: ["2020-2021", "2025-2026"],
                    plans: {
                        "2025-2026": [
                            { code: "PHED202", name: "Invasion Games", ch: 2, type: "Major" },
                            { code: "PHED203", name: "Swimming", ch: 2, type: "Major" },
                            { code: "PHED204", name: "Human Anatomy & Physiology", ch: 4, type: "Major" },
                            { code: "PHED207", name: "Exercise Physiology", ch: 3, type: "Major" },
                            { code: "PHED208", name: "Motor Learning", ch: 3, type: "Major" },
                            { code: "PHED310", name: "Teaching Methods (Elem)", ch: 3, type: "Prof" },
                            { code: "PHED401", name: "Teaching Methods (Sec)", ch: 3, type: "Prof" },
                            { code: "PHED409", name: "Student Teaching in HPE", ch: 9, type: "Internship" }
                        ]
                    }
                },
                {
                    id: "sped_gifted",
                    name: "Special Ed: Gifted and Talented",
                    cohorts: ["2020-2021", "2022-2023", "2025-2026"],
                    plans: {
                        "2025-2026": [
                            { code: "SPED101", name: "Exceptional Children", ch: 3, type: "Core" },
                            { code: "SPED210", name: "Assessment in Special Ed", ch: 3, type: "Major" },
                            { code: "SPED321", name: "Gifted and Talented", ch: 3, type: "Major" },
                            { code: "SPED331", name: "Curriculum for Gifted", ch: 3, type: "Conc" },
                            { code: "SPED564", name: "Student Teaching", ch: 9, type: "Internship" }
                        ]
                    }
                },
                {
                    id: "sped_mild",
                    name: "Special Ed: Mild/Mod Disabilities",
                    cohorts: ["2020-2021", "2022-2023", "2025-2026"],
                    plans: {
                        "2025-2026": [
                            { code: "SPED101", name: "Exceptional Children", ch: 3, type: "Core" },
                            { code: "SPED312", name: "Mild/Mod Disabilities", ch: 3, type: "Conc" },
                            { code: "SPED361", name: "Teaching Children with Mild/Mod", ch: 3, type: "Conc" },
                            { code: "SPED561", name: "Student Teaching (Mild)", ch: 9, type: "Internship" }
                        ]
                    }
                },
                {
                    id: "sped_sensory",
                    name: "Special Ed: Sensory Impairments",
                    cohorts: ["2025-2026"],
                    plans: {
                        "2025-2026": [
                            { code: "SPED101", name: "Exceptional Children", ch: 3, type: "Core" },
                            { code: "SPED315", name: "Sensory Impairments", ch: 3, type: "Conc" },
                            { code: "SPED322", name: "Visual Impairments", ch: 3, type: "Conc" },
                            { code: "SPED412", name: "Hearing Impairments", ch: 3, type: "Conc" },
                            { code: "SPED562", name: "Student Teaching (Sensory)", ch: 9, type: "Internship" }
                        ]
                    }
                },
                {
                    id: "sped_severe",
                    name: "Special Ed: Severe Disabilities",
                    cohorts: ["2025-2026"],
                    plans: {
                        "2025-2026": [
                            { code: "SPED101", name: "Exceptional Children", ch: 3, type: "Core" },
                            { code: "SPED330", name: "Severe Disabilities", ch: 3, type: "Conc" },
                            { code: "SPED324", name: "Functional Curriculum", ch: 3, type: "Conc" },
                            { code: "SPED563", name: "Student Teaching (Severe)", ch: 9, type: "Internship" }
                        ]
                    }
                }
            ]
        };

        function App() {
            const [major, setMajor] = useState(null);
            const [cohort, setCohort] = useState("");
            const [completed, setCompleted] = useState({});
            const [showSummer, setShowSummer] = useState(false);
            const [showNext, setShowNext] = useState(false);
            const [showLong, setShowLong] = useState(false);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [major, cohort, showSummer, showNext, showLong, completed]);

            const allCourses = useMemo(() => {
                if (!major || !cohort) return [];
                return major.plans[cohort] || major.plans["2025-2026"] || [];
            }, [major, cohort]);

            const earnedCH = useMemo(() => {
                return allCourses.filter(c => completed[c.code]).reduce((sum, c) => sum + c.ch, 0);
            }, [allCourses, completed]);

            const remaining = useMemo(() => allCourses.filter(c => !completed[c.code]), [allCourses, completed]);

            const registrationInfo = useMemo(() => {
                const ch = earnedCH;
                let summerDate = "April 09, 2026";
                let fallDate = "April 20-21, 2026";
                let fallGroup = "0-11 Credits";

                // Summer Schedule (Education-Specific Logic from PDF)
                if (ch >= 99) summerDate = "April 06, 2026";
                else if (ch >= 81) summerDate = "April 07, 2026";
                else if (ch >= 63) summerDate = "April 08, 2026";

                // Fall Schedule (Tier-Specific Logic from PDF)
                if (ch >= 84) { fallDate = "April 13-14, 2026"; fallGroup = "84+ CH / Honors"; }
                else if (ch >= 45) { fallDate = "April 14-15, 2026"; fallGroup = "45-83 CH"; }
                else if (ch >= 12) { fallDate = "April 15-16, 2026"; fallGroup = "12-44 CH"; }

                return { summerDate, fallDate, fallGroup };
            }, [earnedCH]);

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-[#D71920] text-white p-6 shadow-lg sticky top-0 z-50 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <i data-lucide="graduation-cap" className="w-8 h-8"></i>
                            <div>
                                <h1 className="text-2xl font-black tracking-tight leading-none">Rasheed Advisor</h1>
                                <p className="text-[10px] uppercase font-bold opacity-80 mt-1 tracking-widest uppercase">COE Academic Assistant</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-6 space-y-6">
                        {/* Welcome Message */}
                        <section className="bg-white rounded-3xl p-8 border-2 border-slate-100 shadow-sm">
                            <div className="flex items-start gap-5">
                                <div className="bg-[#D71920]/10 p-4 rounded-2xl shrink-0">
                                    <i data-lucide="sparkles" className="text-[#D71920] w-8 h-8"></i>
                                </div>
                                <div className="space-y-3">
                                    <h2 className="text-2xl font-black text-slate-900 tracking-tight">Welcome, Future Educator!</h2>
                                    <p className="text-slate-600 leading-relaxed italic text-sm sm:text-base">
                                        "I am Rasheed, your dedicated advisor. My goal is to ensure you navigate your degree requirements with precision. Select your major and cohort to begin."
                                    </p>
                                </div>
                            </div>
                        </section>

                        {/* Selection Area */}
                        <div className="bg-white rounded-3xl p-6 border-2 border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4 shadow-sm">
                            <div className="space-y-1">
                                <label className="text-[10px] font-black uppercase text-slate-400 px-2">Select Major</label>
                                <select onChange={(e) => {
                                    setMajor(COE_DATA.majors.find(x => x.id === e.target.value));
                                    setCohort(""); setCompleted({});
                                }} className="w-full p-4 bg-slate-50 border-2 rounded-2xl font-bold focus:border-[#D71920] outline-none">
                                    <option value="">Select Major...</option>
                                    {COE_DATA.majors.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-black uppercase text-slate-400 px-2">Select Plan Year</label>
                                <select disabled={!major} onChange={(e) => setCohort(e.target.value)} value={cohort} className="w-full p-4 bg-slate-50 border-2 rounded-2xl font-bold focus:border-[#D71920] outline-none disabled:opacity-50">
                                    <option value="">Select Cohort...</option>
                                    {major?.cohorts.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                        </div>

                        {major && cohort && (
                            <div className="space-y-6 animate-in slide-in-from-bottom-5">
                                {/* Checklist */}
                                <section className="bg-white rounded-3xl border-2 border-slate-100 overflow-hidden shadow-sm">
                                    <div className="bg-slate-50 p-6 border-b flex justify-between items-center">
                                        <h3 className="font-black text-slate-800">Pass History</h3>
                                        <div className="bg-[#D71920] text-white px-5 py-2 rounded-2xl text-sm font-black shadow-lg shadow-red-100">{earnedCH} Credits</div>
                                    </div>
                                    <div className="p-4 max-h-[350px] overflow-y-auto space-y-2 checklist-scroll">
                                        {allCourses.map(c => (
                                            <div key={c.code} onClick={() => setCompleted(prev => ({...prev, [c.code]: !prev[c.code]}))} className={`p-4 rounded-xl cursor-pointer border-2 flex items-center gap-4 transition-all ${completed[c.code] ? 'bg-green-50 border-green-200 shadow-inner' : 'bg-white border-slate-50 hover:border-slate-100'}`}>
                                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${completed[c.code] ? 'bg-green-500 border-green-500 text-white' : 'border-slate-200 text-transparent'}`}>
                                                    <i data-lucide="check" className="w-4 h-4"></i>
                                                </div>
                                                <div className="flex-1">
                                                    <span className="text-sm font-bold block text-slate-700">{c.name}</span>
                                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{c.code} • {c.ch} CH</span>
                                                </div>
                                                <span className="text-[9px] font-black bg-slate-100 px-2 py-0.5 rounded border text-slate-400">{c.type}</span>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                {/* Interactive Suggestion Buttons */}
                                <div className="space-y-4">
                                    {/* Summer Button */}
                                    <div className="space-y-2">
                                        <button onClick={() => setShowSummer(!showSummer)} className="w-full p-5 bg-white rounded-2xl border-2 border-slate-100 hover:border-orange-400 transition-all font-black text-slate-700 flex justify-between items-center group">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-orange-50 p-2 rounded-lg group-hover:bg-orange-100"><i data-lucide="sun" className="text-orange-400 w-5 h-5"></i></div>
                                                <span>Summer 2026 Suggested Courses</span>
                                            </div>
                                            <i data-lucide="chevron-down" className={`text-slate-300 transition-transform ${showSummer ? 'rotate-180 text-orange-400' : ''}`}></i>
                                        </button>
                                        {showSummer && (
                                            <div className="p-6 bg-white rounded-3xl border-2 border-orange-100 shadow-inner animate-in zoom-in-95">
                                                <div className="text-[10px] font-black text-orange-600 mb-4 uppercase tracking-widest">Recommended Load (Max 6 CH):</div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    {remaining.slice(0, 2).map(c => (
                                                        <div key={c.code} className="bg-orange-50/50 p-4 rounded-xl border border-orange-100 text-xs font-bold text-slate-700">{c.code}: {c.name}</div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Fall Button */}
                                    <div className="space-y-2">
                                        <button onClick={() => setShowNext(!showNext)} className="w-full p-5 bg-white rounded-2xl border-2 border-slate-100 hover:border-blue-400 transition-all font-black text-slate-700 flex justify-between items-center group">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-blue-50 p-2 rounded-lg group-hover:bg-blue-100"><i data-lucide="calendar" className="text-blue-400 w-5 h-5"></i></div>
                                                <span>Next Semester Suggestions (Fall 2026)</span>
                                            </div>
                                            <i data-lucide="chevron-down" className={`text-slate-300 transition-transform ${showNext ? 'rotate-180 text-blue-400' : ''}`}></i>
                                        </button>
                                        {showNext && (
                                            <div className="p-6 bg-white rounded-3xl border-2 border-blue-100 shadow-inner animate-in zoom-in-95">
                                                <div className="text-[10px] font-black text-blue-600 mb-4 uppercase tracking-widest">Suggested Enrollment (12-19 CH):</div>
                                                <div className="space-y-2">
                                                    {remaining.slice(0, 5).map(c => (
                                                        <div key={c.code} className="p-4 bg-blue-50/50 rounded-xl flex justify-between text-xs font-bold"><span>{c.name}</span><span className="text-blue-400">{c.code}</span></div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Long Term Button */}
                                    <div className="space-y-2">
                                        <button onClick={() => setShowLong(!showLong)} className="w-full p-5 bg-white rounded-2xl border-2 border-slate-100 hover:border-emerald-400 transition-all font-black text-slate-700 flex justify-between items-center group">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-emerald-50 p-2 rounded-lg group-hover:bg-emerald-100"><i data-lucide="trending-up" className="text-emerald-400 w-5 h-5"></i></div>
                                                <span>Long Term Graduation Roadmap</span>
                                            </div>
                                            <i data-lucide="chevron-down" className={`text-slate-300 transition-transform ${showLong ? 'rotate-180 text-emerald-400' : ''}`}></i>
                                        </button>
                                        {showLong && (
                                            <div className="p-6 bg-white rounded-3xl border-2 border-emerald-100 shadow-inner animate-in zoom-in-95">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <div className="space-y-4">
                                                        <h4 className="text-[10px] font-black text-emerald-700 uppercase tracking-widest border-b border-emerald-50 pb-2 flex items-center gap-2"><i data-lucide="map-pin" size="14"></i> Semester +1 Plan</h4>
                                                        <div className="space-y-2">
                                                            {remaining.slice(0, 4).map(c => <div key={c.code} className="p-3 bg-emerald-50/50 rounded-xl text-[10px] font-bold border border-emerald-100 text-slate-600">{c.code} - {c.name}</div>)}
                                                        </div>
                                                    </div>
                                                    <div className="space-y-4">
                                                        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-50 pb-2 flex items-center gap-2"><i data-lucide="forward" size="14"></i> Semester +2 Forecast</h4>
                                                        <div className="space-y-2">
                                                            {remaining.slice(4, 8).map(c => <div key={c.code} className="p-3 bg-slate-50 rounded-xl text-[10px] font-bold border border-slate-100 text-slate-400">{c.code} - {c.name}</div>)}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Detailed Registration Timing - Bottom Section */}
                                <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white space-y-8 shadow-2xl relative overflow-hidden border-4 border-white">
                                    <div className="absolute top-0 right-0 p-10 opacity-5">
                                        <i data-lucide="clock" size="160"></i>
                                    </div>
                                    <div className="relative z-10 space-y-6">
                                        <div className="flex items-center gap-3 border-b border-white/10 pb-6">
                                            <div className="bg-[#D71920] p-2 rounded-lg"><i data-lucide="alarm-clock" className="w-6 h-6"></i></div>
                                            <div>
                                                <h3 className="text-xl font-black tracking-tight">Your Official Registration Window</h3>
                                                <p className="text-[10px] uppercase font-bold text-slate-400 mt-1 tracking-widest">Aligned to COE Early Registration Tiers</p>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                            <div className="p-6 bg-white/5 rounded-3xl border border-white/10 group hover:bg-white/10 transition-all">
                                                <p className="text-[10px] uppercase font-black tracking-widest text-orange-400 mb-2 flex items-center gap-2"><i data-lucide="sun" size="14"></i> Summer 2026 Early Registration</p>
                                                <p className="text-3xl font-black text-white">{registrationInfo.summerDate}</p>
                                                <div className="mt-4 pt-4 border-t border-white/5 space-y-2 text-[10px] font-bold uppercase tracking-widest">
                                                    <div className="flex justify-between"><span>Max Load</span><span className="text-white">6 CH</span></div>
                                                    <div className="flex justify-between"><span>Status Check</span><span className="text-orange-400">{earnedCH} CH Earned</span></div>
                                                </div>
                                            </div>
                                            <div className="p-6 bg-white/5 rounded-3xl border border-white/10 group hover:bg-white/10 transition-all">
                                                <p className="text-[10px] uppercase font-black tracking-widest text-blue-400 mb-2 flex items-center gap-2"><i data-lucide="calendar" size="14"></i> Fall 2026 Early Registration</p>
                                                <p className="text-3xl font-black text-white">{registrationInfo.fallDate}</p>
                                                <p className="text-[10px] font-black text-blue-400/60 mt-1 uppercase tracking-widest">{registrationInfo.fallGroup}</p>
                                                <div className="mt-4 pt-4 border-t border-white/5 space-y-2 text-[10px] font-bold uppercase tracking-widest">
                                                    <div className="flex justify-between"><span>Target Load</span><span className="text-white">12-19 CH</span></div>
                                                    <div className="flex justify-between"><span>Expected Grad</span><span className="text-blue-400">22 CH</span></div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-[#D71920] p-5 rounded-2xl flex items-start gap-4 border border-white/20">
                                            <i data-lucide="alert-circle" className="shrink-0 w-6 h-6"></i>
                                            <div className="text-[10px] font-black uppercase leading-tight tracking-widest">
                                                Important Note: Ensure your Degree Works study plan is Active & Locked and your account is free of HOLDS prior to these dates.
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="max-w-4xl mx-auto px-8 pt-10 pb-4 opacity-30 grayscale text-center">
                         <p className="text-[9px] font-black uppercase tracking-[0.4em]">Rasheed advisor v3.8 • Official UAEU Data</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
